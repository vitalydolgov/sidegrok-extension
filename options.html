<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SideGrok preferences</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <label for="shortcut-enabled">
      <input id="shortcut-enabled" type="checkbox" checked />
      <span>Toggle shortcut</span>
    </label>
    <p>
      Opt+Cmd+A on macOS, or Ctrl+Alt+A on Windows and Linux, shows or hides
      the drawer.
    </p>
    <label for="hide-bottom-panel">
      <input id="hide-bottom-panel" type="checkbox" />
      <span>Hide bot picker</span>
    </label>
    <p>Hides the bot picker at the bottom of the drawer.</p>
    <script src="panel-url.js"></script>
    <script src="options.js"></script>
  </body>
</html>
